# ==============================================================================
# LÚMINA — Configuración de Despliegue en Netlify
# ==============================================================================

[build]
  # Comando de compilación desde la raíz
  command = "npm run build"
  # Carpeta de publicación generada
  publish = "dist"

# Redirecciones para Single Page Application (SPA con React / Vite)
# Permite que rutas como /my-music, /dashboard, /mood, /login funcionen al recargar
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cabeceras de seguridad y optimización de caché para Netlify CDN
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
